name: Validate AstraChefe
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-only-password
          MYSQL_DATABASE: astra_integration
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pintegration-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: node --test tests/*.test.cjs
      - run: mvn -B package
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: MySQL migrations and API integration
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/astra_integration?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bahia
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: integration-only-password
          APP_JWT_SECRET: integration-only-signing-key-at-least-32-bytes
          APP_ADMIN_EMAIL: admin@example.com
          APP_ADMIN_PASSWORD: integration-admin-password
        run: |
          java -jar target/*.jar > /tmp/astrachefe.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/actuator/health > /dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then cat /tmp/astrachefe.log; exit 1; fi
          python3 tests/api-integration.py
          node tests/reload-browser.cjs
